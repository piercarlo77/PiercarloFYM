<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Anteprima LinkedIn</title>
<link rel="stylesheet" href="fonts.css">
<style>
body{margin:0;background:#eceef1;font-family:'Plus Jakarta Sans',sans-serif;color:#112b4d;width:1584px}
h2{font-family:'Red Hat Display';font-weight:700;font-size:28px;margin:32px 48px 12px}
.riga{display:flex;gap:48px;padding:0 48px 24px;align-items:flex-start}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(17,43,77,.15);position:relative}
.desk{width:790px}.desk .banner{width:790px;height:198px;background-size:cover;background-position:center}
.desk .avatar{position:absolute;left:24px;top:108px;width:152px;height:152px;border-radius:50%;background:#4a5f79;border:4px solid #fff}
.desk .corpo{height:120px}
.mob{width:375px}.mob .banner{width:375px;height:94px;background-size:cover;background-position:center}
.mob .avatar{position:absolute;left:16px;top:42px;width:104px;height:104px;border-radius:50%;background:#4a5f79;border:3px solid #fff}
.mob .corpo{height:80px}
.nota{font-size:16px;color:#4a5f79;margin:0 48px 8px}
</style></head><body>
<h2>Il carosello del profilo (cerchio = foto profilo, posizione indicativa)</h2>
<p class="nota">1 — Piercarlo</p>
<div class="riga">
 <div class="card desk"><div class="banner" style="background-image:url(copertina-A-navy.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
 <div class="card mob"><div class="banner" style="background-image:url(copertina-A-navy.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
</div>
<p class="nota">2 — Scuola di Coaching Strategico</p>
<div class="riga">
 <div class="card desk"><div class="banner" style="background-image:url(copertina-2-scuola.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
 <div class="card mob"><div class="banner" style="background-image:url(copertina-2-scuola.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
</div>
<p class="nota">3 — Sport Coaching Strategico</p>
<div class="riga">
 <div class="card desk"><div class="banner" style="background-image:url(copertina-3-sport.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
 <div class="card mob"><div class="banner" style="background-image:url(copertina-3-sport.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
</div>
<p class="nota">4 — I libri</p>
<div class="riga">
 <div class="card desk"><div class="banner" style="background-image:url(copertina-4-libri.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
 <div class="card mob"><div class="banner" style="background-image:url(copertina-4-libri.png)"></div><div class="avatar"></div><div class="corpo"></div></div>
</div>
</body></html>
